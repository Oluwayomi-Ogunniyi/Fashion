<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Designer Portfolio</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            playfair: ['Playfair Display', 'serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Color Theme: Blended Palette for Emotional Appeal
    const theme = {
      primary: 'bg-[#FF6F61]', // Electric Coral
      secondary: 'bg-[#40E0D0]', // Turquoise Blue
      neutral: 'bg-[#F5F5DC]', // Soft Warm Beige
      text: 'text-[#333333]',
      textSecondary: 'text-[#999999]',
    };

    // Cart Modal Component
    const CartModal = ({ cart, setShowCart, setCart }) => {
      const total = cart.reduce((sum, item) => sum + parseInt(item.price.slice(1)), 0);

      const removeFromCart = (index) => {
        setCart(cart.filter((_, i) => i !== index));
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-30 flex items-center justify-center p-4">
          <div className={`bg-white w-full max-w-md rounded-lg p-6 overflow-y-auto max-h-[80vh] ${theme.text}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-2xl font-bold">Shopping Cart</h2>
              <button
                onClick={() => setShowCart(false)}
                className="text-2xl font-bold hover:text-gray-500"
              >
                &times;
              </button>
            </div>
            {cart.length === 0 ? (
              <p className="text-center text-gray-500">Your cart is empty</p>
            ) : (
              <>
                {cart.map((item, index) => (
                  <div key={index} className="flex justify-between items-center mb-4 pb-4 border-b">
                    <div>
                      <h3 className="font-semibold">{item.name}</h3>
                      <p className="text-sm text-gray-500">{item.price}</p>
                    </div>
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => removeFromCart(index)}
                        className="text-red-500 hover:text-red-700"
                      >
                        Remove
                      </button>
                    </div>
                  </div>
                ))}
                <div className="mt-4 pt-4 border-t">
                  <div className="flex justify-between text-lg font-semibold mb-4">
                    <span>Total:</span>
                    <span>${total}</span>
                  </div>
                  <button className={`w-full py-2 rounded-full ${theme.primary} text-white font-poppins hover:bg-[#E55B50] transition-colors`}>
                    Proceed to Checkout
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // Navigation Component
    const Navbar = ({ showCart, setShowCart, cartLength }) => {
      const [isOpen, setIsOpen] = useState(false);

      const navLinks = [
        { name: 'Home', href: 'index.html' },
        { name: 'Collections', href: 'collections.html' },
        { name: 'About', href: 'about.html' },
        { name: 'Shop', href: 'shop.html' },
        { name: 'Contact', href: 'contact.html' },
      ];

      return (
        <nav className={`fixed w-full z-20 ${theme.neutral} ${theme.text} transition-all duration-500 shadow-md`}>
          <div className="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 className="text-2xl font-bold font-playfair">TTT Fashion</h1>
            <div className="flex items-center space-x-4">
              <button
                className="md:hidden focus:outline-none"
                onClick={() => setIsOpen(!isOpen)}
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={isOpen ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16M4 18h16"} />
                </svg>
              </button>
              <ul className={`md:flex space-x-6 ${isOpen ? 'block' : 'hidden'} md:block absolute md:static top-16 left-0 w-full md:w-auto ${theme.neutral} p-4 md:p-0 md:bg-transparent bg-white shadow-md md:shadow-none rounded-b-lg md:rounded-none`}>
                {navLinks.map((item) => (
                  <li key={item.name} className="md:inline-block block md:mr-0 mr-0">
                    <a
                      href={item.href}
                      className={`hover:text-[#FF6F61] transition-colors duration-300 font-poppins ${theme.text} block py-2 md:py-0`}
                    >
                      {item.name}
                    </a>
                  </li>
                ))}
              </ul>
              <div className="relative">
                <button
                  onClick={() => setShowCart(true)}
                  className={`p-2 rounded-full hover:bg-gray-200 transition-colors focus:outline-none ${theme.text}`}
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                  {cartLength > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#FF6F61] text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
                      {cartLength}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </div>
        </nav>
      );
    };

    // Hero Section with Enhanced Animation
    const Hero = () => {
      return (
        <section className="relative h-screen flex items-center justify-center overflow-hidden">
          <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: "url('images/hero-bg.jpg')" }}>
            <div className="absolute inset-0 bg-[#FF6F61] opacity-30"></div>
          </div>
          <div className="relative text-center text-[#333333] animate-zoomIn">
            <h1 className="text-5xl md:text-7xl font-playfair font-bold mb-4">Timeless Elegance</h1>
            <p className={`text-lg md:text-2xl font-poppins mb-6 ${theme.textSecondary}`}>Crafted with Passion and Style</p>
            <a
              href="collections.html"
              className={`inline-block px-8 py-3 ${theme.secondary} ${theme.text} font-poppins rounded-full hover:bg-[#2EC4B6] transition-transform transform hover:scale-110`}
            >
              Explore Collections
            </a>
          </div>
        </section>
      );
    };

    // Collections Section with Refined Animations
    const Collections = () => {
      const collections = [
        { id: 1, title: "Spring Elegance", image: "images/Top1.jpg" },
        { id: 2, title: "Urban Chic", image: "images/Top2.jpg" },
        { id: 3, title: "Couture Classics", image: "images/ShoeB.jpeg" },
      ];

      return (
        <section id="collections" className={`py-16 ${theme.neutral}`}>
          <div className="container mx-auto px-4">
            <h2 className={`text-4xl font-playfair font-bold text-center mb-12 ${theme.text}`}>Our Collections</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {collections.map((collection) => (
                <div
                  key={collection.id}
                  className="relative overflow-hidden rounded-lg shadow-lg transform transition-transform duration-500 hover:scale-105 hover:shadow-xl"
                >
                  <img src={collection.image} alt={collection.title} className="w-full h-96 object-cover" />
                  <div className="absolute inset-0 bg-[#40E0D0] bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-300">
                    <a
                      href="#shop"
                      className={`px-6 py-3 ${theme.primary} ${theme.text} font-poppins rounded-full hover:bg-[#E55B50]`}
                    >
                      View {collection.title}
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // About Section
    const About = () => {
      return (
        <section id="about" className={`py-16 ${theme.secondary} ${theme.text}`}>
          <div className="container mx-auto px-4 flex flex-col md:flex-row items-center">
            <div className="md:w-1/2 mb-8 md:mb-0">
              <img
                src="images/Designer.jpg"
                alt="Designer"
                className="rounded-lg shadow-lg animate-slideInLeft w-full"
              />
            </div>
            <div className="md:w-1/2 md:pl-8">
              <h2 className="text-4xl font-playfair font-bold mb-4">About the Designer</h2>
              <p className={`text-lg font-poppins ${theme.textSecondary} mb-6`}>
                With a vision for timeless beauty, TTT Fashion crafts designs that blend bold innovation with classic elegance. Each piece is a celebration of style and emotion.
              </p>
              <a
                href="#contact"
                className={`inline-block px-6 py-3 ${theme.primary} ${theme.text} font-poppins rounded-full hover:bg-[#E55B50] transition-transform transform hover:scale-110`}
              >
                Connect with Us
              </a>
            </div>
          </div>
        </section>
      );
    };

    // Shop Section
    const Shop = ({ addToCart }) => {
      const products = [
        { id: 1, name: "Spring Elegance", price: "$499", image: "images/spring-elegance.jpg" },
        { id: 2, name: "Tailored Blazers", price: "$299", image: "images/corporatemale2front.jpg" },
        { id: 3, name: "Urban Wears", price: "$349", image: "images/urban-chic.jpg" },
        { id: 4, name: "Hair Ribbons", price: "$349", image: "images/Fhair.jpg" },
        { id: 5, name: "Male Corporate Shoes", price: "$349", image: "images/MShoe.jpg" },
        { id: 6, name: "Vintage Tie", price: "$349", image: "images/tie.jpg" },
        { id: 7, name: "Female Corporate Shoes", price: "$349", image: "images/FShoe.jpg" },
        { id: 8, name: "Leather Belts", price: "$349", image: "images/Belt.jpg" },
        { id: 9, name: "Classic Watches", price: "$349", image: "images/Watch.jpg" },
      ];

      return (
        <section id="shop" className={`py-16 ${theme.neutral}`}>
          <div className="container mx-auto px-4">
            <h2 className={`text-4xl font-playfair font-bold text-center mb-12 ${theme.text}`}>Shop Our Designs</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {products.map((product) => (
                <div
                  key={product.id}
                  className="bg-white rounded-lg shadow-lg p-4 transform transition-transform duration-500 hover:scale-105 hover:shadow-xl"
                >
                  <img src={product.image} alt={product.name} className="w-full h-80 object-cover rounded-lg mb-4" />
                  <h3 className={`text-xl font-poppins font-semibold ${theme.text}`}>{product.name}</h3>
                  <p className={`text-lg font-poppins ${theme.textSecondary}`}>{product.price}</p>
                  <button
                    onClick={() => addToCart(product)}
                    className={`mt-4 w-full px-6 py-2 ${theme.secondary} ${theme.text} font-poppins rounded-full hover:bg-[#2EC4B6] transition-colors`}
                  >
                    Add to Cart
                  </button>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // Contact Section
    const Contact = () => {
      return (
        <section id="contact" className={`py-16 ${theme.neutral} ${theme.text}`}>
          <div className="container mx-auto px-4">
            <h2 className="text-4xl font-playfair font-bold text-center mb-12">Get in Touch</h2>
            <div className="max-w-lg mx-auto">
              <div className="space-y-4">
                <input
                  type="text"
                  placeholder="Your Name"
                  className="w-full p-3 rounded-lg bg-white text-[#333333] placeholder-[#999999] focus:outline-none focus:ring-2 focus:ring-[#FF6F61] transition-all duration-300"
                />
                <input
                  type="email"
                  placeholder="Your Email"
                  className="w-full p-3 rounded-lg bg-white text-[#333333] placeholder-[#999999] focus:outline-none focus:ring-2 focus:ring-[#FF6F61] transition-all duration-300"
                />
                <textarea
                  placeholder="Your Message"
                  className="w-full p-3 rounded-lg bg-white text-[#333333] placeholder-[#999999] focus:outline-none focus:ring-2 focus:ring-[#FF6F61] transition-all duration-300"
                  rows="5"
                ></textarea>
                <button
                  className={`w-full px-6 py-3 ${theme.primary} ${theme.text} font-poppins rounded-full hover:bg-[#E55B50] transition-transform transform hover:scale-105`}
                >
                  Send Message
                </button>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // Footer Component
    const Footer = () => {
      return (
        <footer className={`${theme.neutral} ${theme.text} py-8`}>
          <div className="container mx-auto px-4 text-center">
            <p className="font-poppins">&copy; 2025 TTT Fashion. All rights reserved.</p>
            <div className="mt-4 flex justify-center space-x-4">
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Instagram</a>
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Twitter</a>
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Pinterest</a>
            </div>
          </div>
          <div className="container mx-auto text-center mt-4 text-sm text-black">
            <p>Website designed and developed by <a href="https://theqlip.digital" target="_blank" rel="noopener noreferrer" className="underline hover:text-yellow-300">The Qlip</a>.</p>
          </div>
        </footer>
      );
    };

    // Main App Component
    const App = () => {
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);

      const addToCart = (product) => {
        setCart((prev) => [...prev, product]);
      };

      useEffect(() => {
        const savedCart = localStorage.getItem('cart');
        if (savedCart) {
          setCart(JSON.parse(savedCart));
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('cart', JSON.stringify(cart));
      }, [cart]);

      return (
        <div>
          <Navbar showCart={showCart} setShowCart={setShowCart} cartLength={cart.length} />
          {showCart && <CartModal cart={cart} setShowCart={setShowCart} setCart={setCart} />}
          <Hero />
          <Collections />
          <About />
          <Shop addToCart={addToCart} />
          <Contact />
          <Footer />
        </div>
      );
    };

    // Animation Keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-zoomIn {
        animation: zoomIn 1.2s ease-out;
      }
      .animate-slideInLeft {
        animation: slideInLeft 1s ease-out;
      }
    `;
    document.head.appendChild(style);

    // Render the App with createRoot for React 18
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
