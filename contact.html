<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Fashion Designer Portfolio</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            playfair: ['Playfair Display', 'serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Color Theme: Matching Existing Palette
    const theme = {
      primary: 'bg-[#FF6F61]', // Electric Coral
      secondary: 'bg-[#40E0D0]', // Turquoise Blue
      neutral: 'bg-[#F5F5DC]', // Soft Warm Beige
      text: 'text-[#333333]',
      textSecondary: 'text-[#999999]',
    };

    // Cart Modal Component
    const CartModal = ({ cart, setShowCart, setCart }) => {
      const total = cart.reduce((sum, item) => sum + parseInt(item.price.slice(1)), 0);

      const removeFromCart = (index) => {
        setCart(cart.filter((_, i) => i !== index));
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center p-4">
          <div className={`bg-white w-full max-w-md rounded-lg p-6 overflow-y-auto max-h-[80vh] ${theme.text}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-2xl font-bold">Shopping Cart</h2>
              <button
                onClick={() => setShowCart(false)}
                className="text-2xl font-bold hover:text-gray-500"
              >
                &times;
              </button>
            </div>
            {cart.length === 0 ? (
              <p className="text-center text-gray-500">Your cart is empty</p>
            ) : (
              <>
                {cart.map((item, index) => (
                  <div key={index} className="flex justify-between items-center mb-4 pb-4 border-b">
                    <div>
                      <h3 className="font-semibold">{item.name}</h3>
                      <p className="text-sm text-gray-500">{item.price}</p>
                    </div>
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => removeFromCart(index)}
                        className="text-red-500 hover:text-red-700"
                      >
                        Remove
                      </button>
                    </div>
                  </div>
                ))}
                <div className="mt-4 pt-4 border-t">
                  <div className="flex justify-between text-lg font-semibold mb-4">
                    <span>Total:</span>
                    <span>${total}</span>
                  </div>
                  <button className={`w-full py-2 rounded-full ${theme.primary} text-white font-poppins hover:bg-[#E55B50] transition-colors`}>
                    Proceed to Checkout
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // Navigation Component
    const Navbar = ({ showCart, setShowCart, cartLength }) => {
      const [isOpen, setIsOpen] = useState(false);

      const navLinks = [
        { name: 'Home', href: 'index.html' },
        { name: 'Collections', href: 'collections.html' },
        { name: 'About', href: 'about.html' },
        { name: 'Shop', href: 'shop.html' },
        { name: 'Contact', href: 'contact.html' },
      ];

      return (
        <nav className={`fixed w-full z-20 ${theme.neutral} ${theme.text} transition-all duration-500 shadow-md`}>
          <div className="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 className="text-2xl font-bold font-playfair">TTT Fashion</h1>
            <div className="flex items-center space-x-4">
              <button
                className="md:hidden focus:outline-none"
                onClick={() => setIsOpen(!isOpen)}
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={isOpen ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16M4 18h16"} />
                </svg>
              </button>
              <ul className={`md:flex space-x-6 ${isOpen ? 'block' : 'hidden'} md:block absolute md:static top-16 left-0 w-full md:w-auto ${theme.neutral} p-4 md:p-0 md:bg-transparent bg-white shadow-md md:shadow-none rounded-b-lg md:rounded-none`}>
                {navLinks.map((item) => (
                  <li key={item.name} className="md:inline-block block md:mr-0 mr-0">
                    <a
                      href={item.href}
                      className={`hover:text-[#FF6F61] transition-colors duration-300 font-poppins ${theme.text} block py-2 md:py-0 ${item.name === 'Contact' ? 'text-[#FF6F61]' : ''}`}
                    >
                      {item.name}
                    </a>
                  </li>
                ))}
              </ul>
              <div className="relative">
                <button
                  onClick={() => setShowCart(true)}
                  className={`p-2 rounded-full hover:bg-gray-200 transition-colors focus:outline-none ${theme.text}`}
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                  {cartLength > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#FF6F61] text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
                      {cartLength}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </div>
        </nav>
      );
    };

    // Contact Section
    const Contact = () => {
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData({ ...formData, [name]: value });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        // Simulate form submission
        setTimeout(() => {
          setIsSubmitting(false);
          setFormData({ name: '', email: '', message: '' });
          alert('Message sent successfully!');
        }, 1000);
      };

      return (
        <section id="contact" className={`py-24 ${theme.neutral} min-h-screen pt-20`}>
          <div className="container mx-auto px-4">
            {/* Hero Section */}
            <div className="text-center mb-16">
              <h2 className={`text-5xl font-playfair font-bold ${theme.text} animate-zoomIn mb-4`}>Get in Touch</h2>
              <p className={`text-lg font-poppins ${theme.textSecondary} max-w-2xl mx-auto`}>
                We’d love to hear from you! Whether it’s a question, collaboration, or feedback, reach out and let’s create something beautiful together.
              </p>
            </div>

            {/* Contact Form and Info */}
            <div className="flex flex-col md:flex-row gap-12">
              {/* Contact Form */}
              <div className="md:w-1/2">
                <h3 className={`text-3xl font-playfair font-bold ${theme.text} mb-6`}>Send Us a Message</h3>
                <div className="space-y-6">
                  <input
                    type="text"
                    name="name"
                    value={formData.name}
                    onChange={handleInputChange}
                    placeholder="Your Name"
                    className={`w-full p-4 rounded-lg bg-white ${theme.text} placeholder-[#999999] focus:outline-none focus:ring-2 focus:ring-[#FF6F61] transition-all duration-300 animate-slideInLeft`}
                    required
                  />
                  <input
                    type="email"
                    name="email"
                    value={formData.email}
                    onChange={handleInputChange}
                    placeholder="Your Email"
                    className={`w-full p-4 rounded-lg bg-white ${theme.text} placeholder-[#999999] focus:outline-none focus:ring-2 focus:ring-[#FF6F61] transition-all duration-300 animate-slideInLeft delay-100`}
                    required
                  />
                  <textarea
                    name="message"
                    value={formData.message}
                    onChange={handleInputChange}
                    placeholder="Your Message"
                    className={`w-full p-4 rounded-lg bg-white ${theme.text} placeholder-[#999999] focus:outline-none focus:ring-2 focus:ring-[#FF6F61] transition-all duration-300 animate-slideInLeft delay-200`}
                    rows="6"
                    required
                  ></textarea>
                  <button
                    onClick={handleSubmit}
                    disabled={isSubmitting}
                    className={`w-full px-6 py-3 ${theme.primary} ${theme.text} font-poppins rounded-full hover:bg-[#E55B50] transition-transform transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed`}
                  >
                    {isSubmitting ? 'Sending...' : 'Send Message'}
                  </button>
                </div>
              </div>

              {/* Contact Information */}
              <div className="md:w-1/2">
                <h3 className={`text-3xl font-playfair font-bold ${theme.text} mb-6`}>Contact Information</h3>
                <div className={`space-y-6 ${theme.secondary} p-6 rounded-xl shadow-lg animate-slideInRight`}>
                  <div>
                    <h4 className={`text-lg font-poppins font-semibold ${theme.text}`}>Email</h4>
                    <p className={`text-sm font-poppins ${theme.textSecondary}`}>
                      <a href="mailto:info@designername.com" className="hover:text-[#FF6F61] transition-colors duration-300">info@designername.com</a>
                    </p>
                  </div>
                  <div>
                    <h4 className={`text-lg font-poppins font-semibold ${theme.text}`}>Phone</h4>
                    <p className={`text-sm font-poppins ${theme.textSecondary}`}>
                      <a href="tel:+1234567890" className="hover:text-[#FF6F61] transition-colors duration-300">+1 (234) 567-890</a>
                    </p>
                  </div>
                  <div>
                    <h4 className={`text-lg font-poppins font-semibold ${theme.text}`}>Studio</h4>
                    <p className={`text-sm font-poppins ${theme.textSecondary}`}>
                      123 Fashion Avenue, Lagos, Nigeria
                    </p>
                  </div>
                  <div>
                    <h4 className={`text-lg font-poppins font-semibold ${theme.text}`}>Follow Us</h4>
                    <div className="flex space-x-4">
                      <a href="#" className={`text-sm font-poppins ${theme.textSecondary} hover:text-[#FF6F61] transition-colors duration-300`}>Instagram</a>
                      <a href="#" className={`text-sm font-poppins ${theme.textSecondary} hover:text-[#FF6F61] transition-colors duration-300`}>Twitter</a>
                      <a href="#" className={`text-sm font-poppins ${theme.textSecondary} hover:text-[#FF6F61] transition-colors duration-300`}>Pinterest</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // Footer Component (Matching Existing Site)
    const Footer = () => {
      return (
        <footer className={`${theme.neutral} ${theme.text} py-8`}>
          <div className="container mx-auto px-4 text-center">
            <p className="font-poppins">&copy; 2025 TTT Fashion. All rights reserved.</p>
            <div className="mt-4 flex justify-center space-x-4">
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Instagram</a>
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Twitter</a>
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Pinterest</a>
            </div>
          </div>
          <div className="container mx-auto text-center mt-4 text-sm text-black">
            <p>Website designed and developed by <a href="https://theqlip.digital" target="_blank" rel="noopener noreferrer" className="underline hover:text-yellow-300">The Qlip</a>.</p>
          </div>
        </footer>
      );
    };

    // Main App Component
    const App = () => {
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);

      const addToCart = (product) => {
        setCart((prev) => [...prev, product]);
      };

      useEffect(() => {
        const savedCart = localStorage.getItem('cart');
        if (savedCart) {
          setCart(JSON.parse(savedCart));
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('cart', JSON.stringify(cart));
      }, [cart]);

      return (
        <div>
          <Navbar showCart={showCart} setShowCart={setShowCart} cartLength={cart.length} />
          {showCart && <CartModal cart={cart} setShowCart={setShowCart} setCart={setCart} />}
          <Contact />
          <Footer />
        </div>
      );
    };

    // Animation Keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-zoomIn {
        animation: zoomIn 1.2s ease-out;
      }
      .animate-slideInLeft {
        animation: slideInLeft 1s ease-out;
      }
      .animate-slideInRight {
        animation: slideInRight 1s ease-out;
      }
      .delay-100 {
        animation-delay: 100ms;
      }
      .delay-200 {
        animation-delay: 200ms;
      }
    `;
    document.head.appendChild(style);

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
