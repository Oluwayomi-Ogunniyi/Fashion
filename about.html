<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Fashion</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            playfair: ['Playfair Display', 'serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Color Theme: Matching Existing Palette
    const theme = {
      primary: 'bg-[#FF6F61]', // Electric Coral
      secondary: 'bg-[#40E0D0]', // Turquoise Blue
      neutral: 'bg-[#F5F5DC]', // Soft Warm Beige
      text: 'text-[#333333]',
      textSecondary: 'text-[#999999]',
    };

    // Cart Modal Component
    const CartModal = ({ cart, setShowCart, setCart }) => {
      const total = cart.reduce((sum, item) => sum + parseInt(item.price.slice(1)), 0);

      const removeFromCart = (index) => {
        setCart(cart.filter((_, i) => i !== index));
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center p-4">
          <div className={`bg-white w-full max-w-md rounded-lg p-6 overflow-y-auto max-h-[80vh] ${theme.text}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-2xl font-bold">Shopping Cart</h2>
              <button
                onClick={() => setShowCart(false)}
                className="text-2xl font-bold hover:text-gray-500"
              >
                &times;
              </button>
            </div>
            {cart.length === 0 ? (
              <p className="text-center text-gray-500">Your cart is empty</p>
            ) : (
              <>
                {cart.map((item, index) => (
                  <div key={index} className="flex justify-between items-center mb-4 pb-4 border-b">
                    <div>
                      <h3 className="font-semibold">{item.name}</h3>
                      <p className="text-sm text-gray-500">{item.price}</p>
                    </div>
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => removeFromCart(index)}
                        className="text-red-500 hover:text-red-700"
                      >
                        Remove
                      </button>
                    </div>
                  </div>
                ))}
                <div className="mt-4 pt-4 border-t">
                  <div className="flex justify-between text-lg font-semibold mb-4">
                    <span>Total:</span>
                    <span>${total}</span>
                  </div>
                  <button className={`w-full py-2 rounded-full ${theme.primary} text-white font-poppins hover:bg-[#E55B50] transition-colors`}>
                    Proceed to Checkout
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // Navigation Component
    const Navbar = ({ showCart, setShowCart, cartLength }) => {
      const [isOpen, setIsOpen] = useState(false);
      const currentPath = window.location.pathname.split("/").pop(); // e.g. "about.html"

      const navLinks = [
        { name: 'Home', href: 'index.html' },
        { name: 'Collections', href: 'collections.html' },
        { name: 'About', href: 'about.html' },
        { name: 'Shop', href: 'shop.html' },
        { name: 'Contact', href: 'contact.html' },
      ];

      return (
        <nav className={`fixed w-full z-20 ${theme.neutral} ${theme.text} transition-all duration-500 shadow-md`}>
          <div className="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 className="text-2xl font-bold font-playfair">TTT Fashion</h1>
            <div className="flex items-center space-x-4">
              <button
                className="md:hidden focus:outline-none"
                onClick={() => setIsOpen(!isOpen)}
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={isOpen ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16M4 18h16"} />
                </svg>
              </button>
              <ul className={`md:flex space-x-6 ${isOpen ? 'block' : 'hidden'} md:block absolute md:static top-16 left-0 w-full md:w-auto ${theme.neutral} p-4 md:p-0 md:bg-transparent bg-white shadow-md md:shadow-none rounded-b-lg md:rounded-none`}>
                {navLinks.map((item) => {
                  const isActive = currentPath === item.href; // check if current page
                  return (
                    <li key={item.name} className="md:inline-block block md:mr-0 mr-0">
                      <a
                        href={item.href}
                        className={`hover:text-[#FF6F61] transition-colors duration-300 font-poppins ${theme.text} block py-2 md:py-0 ${isActive ? 'text-[#FF6F61]' : ''}`}
                      >
                        {item.name}
                      </a>
                    </li>
                  );
                })}
              </ul>
              <div className="relative">
                <button
                  onClick={() => setShowCart(true)}
                  className={`p-2 rounded-full hover:bg-gray-200 transition-colors focus:outline-none ${theme.text}`}
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                  {cartLength > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#FF6F61] text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
                      {cartLength}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </div>
        </nav>
      );
    };

    // About Section
    const About = () => {
      return (
        <section id="about" className={`py-24 ${theme.neutral} min-h-screen pt-20`}>
          <div className="container mx-auto px-4">
            {/* Hero Section */}
            <div className="text-center mb-16">
              <h2 className={`text-5xl font-playfair font-bold ${theme.text} animate-zoomIn mb-4`}>About TTT Fashion</h2>
              <p className={`text-lg font-poppins ${theme.textSecondary} max-w-2xl mx-auto`}>
                Crafting timeless elegance with a modern twist, TTT Fashion redefines fashion through passion, innovation, and artistry.
              </p>
            </div>

            {/* Main Content: Image and Story */}
            <div className="flex flex-col md:flex-row items-center mb-16">
              <div className="md:w-1/2 mb-8 md:mb-0">
                <img
                  src="images/Designer.jpg"
                  alt="Designer"
                  className="rounded-xl shadow-xl w-full h-96 object-cover animate-slideInLeft"
                />
              </div>
              <div className="md:w-1/2 md:pl-8">
                <h3 className={`text-3xl font-playfair font-bold ${theme.text} mb-4`}>Our Story</h3>
                <p className={`text-lg font-poppins ${theme.textSecondary} mb-6`}>
                  Founded by TTT Fashion, our brand is a celebration of individuality and elegance. Inspired by global cultures and modern aesthetics, each piece tells a story of craftsmanship and creativity. With a commitment to sustainable practices and innovative design, we create fashion that resonates with the heart and soul.
                </p>
                <a
                  href="/contact"
                  className={`inline-block px-6 py-3 ${theme.primary} ${theme.text} font-poppins rounded-full hover:bg-[#E55B50] transition-transform transform hover:scale-110`}
                >
                  Connect with Us
                </a>
              </div>
            </div>

            {/* Achievements Section */}
            <div className={`py-16 ${theme.secondary}`}>
              <div className="container mx-auto px-4">
                <h3 className={`text-3xl font-playfair font-bold text-center ${theme.text} mb-12`}>Our Achievements</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {[
                    { title: "Global Recognition", description: "Featured in Vogue, Elle, and Harper’s Bazaar for innovative designs." },
                    { title: "Sustainable Fashion", description: "Pioneering eco-friendly materials and ethical production practices." },
                    { title: "Award-Winning Designs", description: "Recipient of the 2024 International Fashion Award for Excellence." },
                  ].map((achievement, index) => (
                    <div
                      key={index}
                      className="bg-white rounded-xl shadow-lg p-6 transform transition-all duration-500 hover:scale-105 hover:shadow-2xl"
                    >
                      <h4 className={`text-xl font-playfair font-semibold ${theme.text} mb-2`}>{achievement.title}</h4>
                      <p className={`text-sm font-poppins ${theme.textSecondary}`}>{achievement.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Call to Action Section */}
            <div className="text-center">
              <h3 className={`text-3xl font-playfair font-bold ${theme.text} mb-4`}>Join Our Journey</h3>
              <p className={`text-lg font-poppins ${theme.textSecondary} mb-6 max-w-2xl mx-auto`}>
                Discover the art of fashion and become part of our story. Explore our collections or reach out to collaborate.
              </p>
              <a
                href="/collections"
                className={`inline-block px-8 py-3 ${theme.secondary} ${theme.text} font-poppins rounded-full hover:bg-[#2EC4B6] transition-transform transform hover:scale-110`}
              >
                Explore Collections
              </a>
            </div>
          </div>
        </section>
      );
    };

    // Footer Component (Matching Existing Site)
    const Footer = () => {
      return (
        <footer className={`${theme.neutral} ${theme.text} py-8`}>
          <div className="container mx-auto px-4 text-center">
            <p className="font-poppins">&copy; 2025 TTT Fashion. All rights reserved.</p>
            <div className="mt-4 flex justify-center space-x-4">
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Instagram</a>
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Twitter</a>
              <a href="#" className="hover:text-[#FF6F61] transition-colors duration-300">Pinterest</a>
            </div>
          </div>
          <div className="container mx-auto text-center mt-4 text-sm text-black">
            <p>Website template is designed and developed by <a href="https://theqlip.digital" target="_blank" rel="noopener noreferrer" className="underline hover:text-yellow-300">The Qlip</a>.</p>
          </div>
        </footer>
      );
    };

    // Main App Component
    const App = () => {
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);

      const addToCart = (product) => {
        setCart((prev) => [...prev, product]);
      };

      useEffect(() => {
        const savedCart = localStorage.getItem('cart');
        if (savedCart) {
          setCart(JSON.parse(savedCart));
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('cart', JSON.stringify(cart));
      }, [cart]);

      return (
        <div>
          <Navbar showCart={showCart} setShowCart={setShowCart} cartLength={cart.length} />
          {showCart && <CartModal cart={cart} setShowCart={setShowCart} setCart={setCart} />}
          <About />
          <Footer />
        </div>
      );
    };

    // Animation Keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-zoomIn {
        animation: zoomIn 1.2s ease-out;
      }
      .animate-slideInLeft {
        animation: slideInLeft 1s ease-out;
      }
    `;
    document.head.appendChild(style);

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
